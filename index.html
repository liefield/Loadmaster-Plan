<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loadmaster Pro - P&B KC-390</title>
    
    <!-- PWA / Web App Manifest e Ícones - FORÇANDO A RAIZ DO GITHUB -->
    <link rel="manifest" href="./manifest.json?v=2">
    <meta name="theme-color" content="#003366">
    
    <!-- Meta tags para iOS (Apple) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="P&B KC-390">
    <link rel="apple-touch-icon" href="./ios-icon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --fab-blue: #003366;
            --fab-light: #4c72a4;
        }
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        .bg-fab { background-color: var(--fab-blue); }
        .text-fab { color: var(--fab-blue); }
        .tab-active { border-bottom: 4px solid var(--fab-blue); font-weight: bold; color: var(--fab-blue); }
        .tab-inactive { color: #6b7280; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- ================= TELA DE LOGIN ================= -->
    <div id="loginScreen" class="flex-1 flex flex-col justify-center items-center px-6">
        <div class="w-full max-w-sm bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
            <div class="text-center mb-8">
                <img src="./ios-icon.png" alt="Logo P&B" class="w-24 h-24 mx-auto mb-4 rounded-2xl shadow-md">
                <h1 class="text-3xl font-extrabold text-fab mb-2">✈️ KC-390 P&B</h1>
                <p class="text-gray-500 text-sm">Acesso Restrito - Loadmasters</p>
            </div>
            
            <form id="loginForm" class="space-y-5" onsubmit="event.preventDefault(); handleLogin();">
                <div>
                    <label class="block text-sm font-medium text-gray-700">E-mail</label>
                    <input type="email" id="email" required class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-800 outline-none" placeholder="militar@fab.mil.br">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Senha</label>
                    <input type="password" id="password" required class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-800 outline-none" placeholder="••••••••">
                </div>
                
                <button type="submit" class="w-full bg-fab text-white p-3 rounded-lg font-bold hover:bg-blue-900 transition">ENTRAR</button>
            </form>
            
            <div class="mt-4 text-center">
                <button onclick="handleResetPassword()" class="text-sm text-blue-600 hover:underline">Esqueci minha senha</button>
            </div>
        </div>
    </div>

    <!-- ================= APP PRINCIPAL ================= -->
    <div id="mainApp" class="hidden flex-col h-full">
        
        <!-- Header -->
        <header class="bg-fab text-white p-4 shadow-md flex justify-between items-center z-10 pt-safe">
            <h1 class="text-lg font-bold">Carta E - KC-390</h1>
            <div class="flex items-center space-x-2">
                <span id="saveStatus" class="text-xs bg-blue-800 px-2 py-1 rounded text-blue-200">Salvo</span>
                <button onclick="handleLogout()" class="text-sm bg-red-600 px-3 py-1 rounded hover:bg-red-700">Sair</button>
            </div>
        </header>

        <!-- Navegação por Abas -->
        <nav class="bg-white flex justify-around shadow z-10 sticky top-0 text-sm">
            <button onclick="switchTab('tab-aeronave')" id="btn-tab-aeronave" class="flex-1 py-3 tab-active text-center">Aeronave</button>
            <button onclick="switchTab('tab-operacional')" id="btn-tab-operacional" class="flex-1 py-3 tab-inactive text-center">Missão</button>
            <button onclick="switchTab('tab-resultado')" id="btn-tab-resultado" class="flex-1 py-3 tab-inactive text-center">Resultados</button>
        </nav>

        <!-- Conteúdo Rolável -->
        <main class="flex-1 overflow-y-auto p-4 pb-20">
            
            <!-- ABA 1: Dados Mestres da Aeronave -->
            <section id="tab-aeronave" class="space-y-4">
                <div class="bg-white p-4 rounded-xl shadow">
                    <h2 class="font-bold text-fab mb-4 border-b pb-2">Dados Básicos (Basic Weight)</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs text-gray-500 uppercase">Matrícula da Aeronave</label>
                            <input type="text" id="anvMatricula" value="FAB 2853" oninput="saveData()" class="w-full p-2 border-b-2 border-gray-300 focus:border-blue-800 outline-none text-lg font-semibold">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs text-gray-500 uppercase">Peso Básico (kg)</label>
                                <input type="text" inputmode="decimal" id="basicWeight" value="51048" oninput="sanitizeAndCalculate(this)" class="w-full p-2 bg-gray-50 border rounded text-lg font-bold">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 uppercase">Momento Básico</label>
                                <input type="text" inputmode="decimal" id="basicMoment" value="939466" oninput="sanitizeAndCalculate(this)" class="w-full p-2 bg-gray-50 border rounded text-lg font-bold">
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ABA 2: Operacional / Cargas -->
            <section id="tab-operacional" class="hidden space-y-6">
                <div id="dynamicInputs"></div>
            </section>

            <!-- ABA 3: Resultados e Limites -->
            <section id="tab-resultado" class="hidden space-y-4">
                <div class="bg-white p-5 rounded-xl shadow-lg border-t-4 border-blue-800">
                    <h2 class="text-xl font-black text-center mb-6 text-gray-800">Resumo de P&B (MZFW)</h2>
                    
                    <div class="grid grid-cols-2 gap-4 text-center mb-6">
                        <div class="p-3 bg-gray-100 rounded-lg">
                            <p class="text-xs text-gray-500 uppercase">Peso Total (kg)</p>
                            <p id="resWeight" class="text-2xl font-bold text-blue-900">0</p>
                        </div>
                        <div class="p-3 bg-gray-100 rounded-lg">
                            <p class="text-xs text-gray-500 uppercase">Momento Total</p>
                            <p id="resMoment" class="text-xl font-bold text-gray-700">0</p>
                        </div>
                        <div class="p-3 bg-gray-100 rounded-lg">
                            <p class="text-xs text-gray-500 uppercase">CG (Metros)</p>
                            <p id="resCG" class="text-xl font-bold text-gray-700">0.000</p>
                        </div>
                        <div class="p-3 bg-blue-50 border border-blue-200 rounded-lg">
                            <p class="text-xs text-blue-800 font-bold uppercase">% MAC</p>
                            <p id="resMAC" class="text-2xl font-black text-blue-900">0.00%</p>
                        </div>
                    </div>

                    <!-- Alertas Operacionais -->
                    <div id="mzfwAlert" class="p-4 rounded-lg font-bold text-center text-white bg-green-500 shadow">
                        MZFW DENTRO DO LIMITE (Máx 73.500 kg)
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Firebase SDK com App Check -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js";

        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "seu-app.firebaseapp.com",
            databaseURL: "https://seu-app.firebaseio.com",
            projectId: "seu-app",
            storageBucket: "seu-app.appspot.com",
            messagingSenderId: "123456",
            appId: "1:123456:web:123456"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        try {
            initializeAppCheck(app, {
                provider: new ReCaptchaV3Provider('SUA_CHAVE_PUBLICA_DO_RECAPTCHA_V3'),
                isTokenAutoRefreshEnabled: true 
            });
        } catch(e) {
            console.log("App Check initialized or bypassed in dev");
        }

        window.handleLogin = () => {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('flex');
            renderForm();
            loadSavedData();
            calculate();
        };

        window.handleLogout = () => {
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('flex');
            document.getElementById('loginScreen').classList.remove('hidden');
        };

        window.handleResetPassword = () => {
            const email = document.getElementById('email').value;
            if(!email) return alert('Digite seu e-mail no campo acima para recuperar a senha.');
            alert('E-mail de redefinição enviado para: ' + email);
        };
    </script>

    <!-- Lógica de Negócio, Sanitização e Persistência Offline -->
    <script>
        const LEMAC = 16.474;
        const MAC = 4.646;
        const MZFW_MAX = 73500;
        const IN_TO_M = 0.0254;

        const loadStations = [
            { id: 'pilotos', category: 'Tripulação', label: 'Pilotos', arm: 277 },
            { id: 'mecanico', category: 'Tripulação', label: 'Mecânico', arm: 321 },
            { id: 'lm', category: 'Tripulação', label: 'LM Station', arm: 424 },
            { id: 'missao', category: 'Equipamentos', label: 'Carga de Missão', arm: 900 },
            { id: 'garfo', category: 'Equipamentos', label: 'Garfo de Reboque', arm: 970 },
            { id: 'sidepax', category: 'Carga / PAX', label: 'Side Pax', arm: 630 },
            { id: 'centerpax', category: 'Carga / PAX', label: 'Center Pax', arm: 665 },
            { id: 'pallet1', category: 'Carga / PAX', label: 'Pallet 1', arm: 575 },
            { id: 'pallet4', category: 'Carga / PAX', label: 'Pallet 4', arm: 665 },
            { id: 'rampa1', category: 'Carga / PAX', label: 'Rampa 1', arm: 990 }
        ];

        function switchTab(tabId) {
            ['tab-aeronave', 'tab-operacional', 'tab-resultado'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById('btn-' + id).classList.replace('tab-active', 'tab-inactive');
            });
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).classList.replace('tab-inactive', 'tab-active');
        }

        function renderForm() {
            const container = document.getElementById('dynamicInputs');
            if (container.innerHTML.trim() !== '') return;
            
            const grouped = loadStations.reduce((acc, curr) => {
                (acc[curr.category] = acc[curr.category] || []).push(curr);
                return acc;
            }, {});

            for (const [category, items] of Object.entries(grouped)) {
                let html = `<div class="bg-white p-4 rounded-xl shadow mb-4">
                                <h3 class="font-bold text-fab border-b pb-2 mb-3">${category}</h3>`;
                
                items.forEach(item => {
                    html += `
                    <div class="flex justify-between items-center mb-3">
                        <div class="w-1/2 pr-2">
                            <label class="block text-xs font-semibold text-gray-600">${item.label}</label>
                            <span class="text-[10px] text-gray-400">Braço: ${item.arm}"</span>
                        </div>
                        <div class="w-1/2 relative">
                            <input type="text" inputmode="decimal" id="peso_${item.id}" oninput="sanitizeAndCalculate(this)" placeholder="0" class="w-full p-2 bg-gray-50 border rounded text-right pr-8 font-semibold text-gray-700 outline-none focus:ring-1 focus:ring-blue-500">
                            <span class="absolute right-3 top-2.5 text-xs text-gray-400">kg</span>
                        </div>
                    </div>`;
                });
                html += `</div>`;
                container.innerHTML += html;
            }
        }

        window.sanitizeAndCalculate = function(input) {
            if (input && input.value) {
                input.value = input.value.replace(',', '.');
            }
            calculate();
            saveData();
        };

        window.saveData = function() {
            try {
                const data = {
                    matricula: document.getElementById('anvMatricula').value,
                    basicWeight: document.getElementById('basicWeight').value,
                    basicMoment: document.getElementById('basicMoment').value
                };
                loadStations.forEach(item => {
                    const el = document.getElementById('peso_' + item.id);
                    if (el) data['peso_' + item.id] = el.value;
                });
                localStorage.setItem('kc390_loadmaster_state', JSON.stringify(data));
                
                const status = document.getElementById('saveStatus');
                if(status) {
                    status.innerText = 'Salvo';
                    status.className = 'text-xs bg-green-700 px-2 py-1 rounded text-white';
                    setTimeout(() => {
                        status.innerText = 'Salvo';
                        status.className = 'text-xs bg-blue-800 px-2 py-1 rounded text-blue-200';
                    }, 1000);
                }
            } catch(e) {
                console.error("Erro ao salvar no localStorage:", e);
            }
        };

        function loadSavedData() {
            try {
                const raw = localStorage.getItem('kc390_loadmaster_state');
                if (!raw) return;
                const data = JSON.parse(raw);
                
                if (data.matricula) document.getElementById('anvMatricula').value = data.matricula;
                if (data.basicWeight) document.getElementById('basicWeight').value = data.basicWeight;
                if (data.basicMoment) document.getElementById('basicMoment').value = data.basicMoment;
                
                loadStations.forEach(item => {
                    const el = document.getElementById('peso_' + item.id);
                    if (el && data['peso_' + item.id] !== undefined) {
                        el.value = data['peso_' + item.id];
                    }
                });
            } catch(e) {
                console.error("Erro ao carregar dados salvos:", e);
            }
        }

        window.calculate = function() {
            let basicWeight = parseFloat(document.getElementById('basicWeight').value);
            let basicMoment = parseFloat(document.getElementById('basicMoment').value);

            if (isNaN(basicWeight)) basicWeight = 0;
            if (isNaN(basicMoment)) basicMoment = 0;

            let totalWeight = basicWeight;
            let totalMoment = basicMoment;

            loadStations.execute = loadStations.forEach(item => {
                let input = document.getElementById('peso_' + item.id);
                if (input && input.value !== '') {
                    let weight = parseFloat(input.value);
                    if (!isNaN(weight)) {
                        let armMeters = item.arm * IN_TO_M; 
                        let moment = weight * armMeters;
                        
                        totalWeight += weight;
                        totalMoment += moment;
                    }
                }
            });

            loadStations.forEach(item => {
                let input = document.getElementById('peso_' + item.id);
                if (input && input.value !== '') {
                    let weight = parseFloat(input.value);
                    if (!isNaN(weight)) {
                        let armMeters = item.arm * IN_TO_M; 
                        let moment = weight * armMeters;
                        
                        totalWeight += weight;
                        totalMoment += moment;
                    }
                }
            });

            let cgMeters = totalWeight > 0 ? (totalMoment / totalWeight) : 0;
            let macPercent = totalWeight > 0 ? ((cgMeters - LEMAC) / MAC) * 100 : 0;

            document.getElementById('resWeight').innerText = Math.round(totalWeight).toLocaleString('pt-BR');
            document.getElementById('resMoment').innerText = totalMoment.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById('resCG').innerText = cgMeters.toFixed(3);
            document.getElementById('resMAC').innerText = macPercent.toFixed(2) + '%';

            const alertBox = document.getElementById('mzfwAlert');
            if (totalWeight > MZFW_MAX) {
                alertBox.className = "p-4 rounded-lg font-bold text-center text-white bg-red-600 shadow animate-pulse";
                alertBox.innerText = `⚠️ MZFW EXCEDIDO! (${(totalWeight - MZFW_MAX).toLocaleString('pt-BR')} kg acima do limite estrutural)`;
            } else {
                alertBox.className = "p-4 rounded-lg font-bold text-center text-white bg-green-500 shadow";
                alertBox.innerText = "✅ MZFW DENTRO DO LIMITE (Máx 73.500 kg)";
            }
        };
    </script>
</body>
</html>
